    function shuffleArray(array) {
      const copiedArray = [...array];

      for (let i = copiedArray.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copiedArray[i], copiedArray[j]] = [copiedArray[j], copiedArray[i]];
      }

      return copiedArray;
    }

    function createRandomFoodsByRestaurant() {
      // เอาโรตีออก ไม่ให้ถูกสุ่มเข้าร้าน
      const availableFoods = baseFoods.filter((food) => {
        return food.id !== "food066" && food.name !== "โรตี";
      });

      return restaurants.flatMap((restaurant) => {
        const randomFoods = shuffleArray(availableFoods).slice(0, 5);

        return randomFoods.map((food, index) => {
          const menuSlot = index + 1;
          const menuSlotText = String(menuSlot).padStart(2, "0");

          return {
            ...food,

            // Document ID ใหม่ ไม่ซ้ำ และกดซ้ำจะทับ 5 เมนูเดิมของร้านนั้น
            id: `${restaurant.id}_food${menuSlotText}`,

            // ID อาหารต้นฉบับ ใช้เชื่อมกับ AI / nutrition_data_service.dart
            originalFoodId: food.id,

            // ลำดับเมนูในร้าน
            menuSlot: menuSlot,

            // เชื่อมกับ collection restaurants
            restaurantId: restaurant.id,
            restaurantName: restaurant.name
          };
        });
      });
    }


    // กำหนด Type ให้ชัดก่อนบันทึกลง Firestore
    // string  = ข้อความ
    // int     = ตัวเลขจำนวนเต็ม
    // boolean = true / false
    // array   = รายการหลายค่า
    const toStringValue = (value) => value === undefined || value === null ? "" : String(value);
    const toIntValue = (value) => {
      const numberValue = Number(value);
      return Number.isFinite(numberValue) ? Math.round(numberValue) : 0;
    };
    const toArrayValue = (value) => Array.isArray(value) ? value.map(item => String(item)) : [];

    function normalizeFood(food) {
      const status = toStringValue(food.status);

      return {
        // String
        id: toStringValue(food.id),
        originalFoodId: toStringValue(food.originalFoodId),
        restaurantId: toStringValue(food.restaurantId),
        restaurantName: toStringValue(food.restaurantName),
        name: toStringValue(food.name),
        imageUrl: toStringValue(food.imageUrl),
        ingredients: toStringValue(food.ingredients),
        diabetesRisk: toStringValue(food.diabetesRisk),
        hypertensionRisk: toStringValue(food.hypertensionRisk),
        dyslipidemiaRisk: toStringValue(food.dyslipidemiaRisk),
        kidneyRisk: toStringValue(food.kidneyRisk),
        obesityRisk: toStringValue(food.obesityRisk),
        riskNote: toStringValue(food.riskNote),
        recommendation: toStringValue(food.recommendation),
        nutritionSource: toStringValue(food.nutritionSource),
        riskCriteria: toStringValue(food.riskCriteria),
        medicalDisclaimer: toStringValue(food.medicalDisclaimer),
        status: status,

        // Int / Number
        menuSlot: toIntValue(food.menuSlot),
        portionG: toIntValue(food.portionG),
        calories: toIntValue(food.calories),
        carb: toIntValue(food.carb),
        sugar: toIntValue(food.sugar),
        protein: toIntValue(food.protein),
        fat: toIntValue(food.fat),
        saturatedFat: toIntValue(food.saturatedFat),
        sodium: toIntValue(food.sodium),

        // Map / Object ที่ข้างในเป็น String
        risks: {
          diabetes: toStringValue(food.risks?.diabetes),
          hypertension: toStringValue(food.risks?.hypertension),
          dyslipidemia: toStringValue(food.risks?.dyslipidemia),
          kidney: toStringValue(food.risks?.kidney),
          obesity: toStringValue(food.risks?.obesity)
        },

        // Array<String>
        suitableForDiseases: toArrayValue(food.suitableForDiseases),
        cautionForDiseases: toArrayValue(food.cautionForDiseases),

        // Boolean
        isRecommended: status === "เหมาะสม",
        shouldCaution: status === "ควรระวัง",
        isNotRecommended: status === "ไม่แนะนำ",
        isActive: true,
        isSeedData: true,

        // Timestamp
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      };
    }

    const result = document.getElementById("result");
    const seedBtn = document.getElementById("seedBtn");

    seedBtn.addEventListener("click", async () => {
      result.textContent = "กำลังเพิ่มข้อมูล...";
      seedBtn.disabled = true;

      try {
        const foods = createRandomFoodsByRestaurant();
        let successCount = 0;

        for (const food of foods) {
          const typedFood = normalizeFood(food);
          await setDoc(
            doc(
              db,
              "restaurants",
              typedFood.restaurantId,
              "foods",
              typedFood.id
            ),
            typedFood
          );
          successCount++;
          result.textContent = `เพิ่มแล้ว ${successCount}/${foods.length} รายการ`;
        }

        result.textContent = `สุ่มและเพิ่มข้อมูลสำเร็จแล้ว ✅
ทั้งหมด ${successCount} รายการ
8 ร้าน ร้านละ 5 เมนู
ไม่มีเมนูโรตี
Subcollection: restaurants/{restaurantId}/foods`;
      } catch (error) {
        console.error(error);
        result.textContent = "เกิดข้อผิดพลาด ❌\n" + error.message;
      } finally {
        seedBtn.disabled = false;
      }
    });
